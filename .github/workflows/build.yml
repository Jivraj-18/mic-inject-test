name: build-dex
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and dex
        run: |
          set -e
          javac -source 8 -target 8 MicInject.java
          D8=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/d8 | sort -V | tail -1)
          echo "using d8: $D8"
          "$D8" --min-api 31 --output . MicInject.class
          ls -la classes.dex

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dex
          name: Latest build
          files: |
            classes.dex
            run.sh
